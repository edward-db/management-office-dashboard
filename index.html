<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Inline preloaded dataset if available (generated by build:data)
      // Prefer demo dataset if present for quick demos
      async function start() {
        try {
          const res = await fetch('data/tenants_demo.json');
          if (res.ok) {
            const txt = await res.text();
            if (txt) {
              const el = document.createElement('script');
              el.id = 'preloaded-tenants-json';
              el.type = 'application/json';
              el.textContent = txt;
              document.body.appendChild(el);
            }
          }
        } catch {}
        await import('./src/main.tsx');
      }
      start();
    </script>
  </body>
</html>
