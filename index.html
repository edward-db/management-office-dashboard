<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenant Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Inline preloaded dataset if available (generated by build:data)
      // Prefer demo dataset if present for quick demos
      async function start() {
        try {
          const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          const url = isDev ? `data/tenants_demo.json?t=${Date.now()}` : 'data/tenants_demo.json';
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const txt = await res.text();
            if (txt) {
              const el = document.createElement('script');
              el.id = 'preloaded-tenants-json';
              el.type = 'application/json';
              el.textContent = txt;
              document.body.appendChild(el);
            }
          }
        } catch {}
        await import('./src/main.tsx');
      }
      start();
    </script>
  </body>
</html>
